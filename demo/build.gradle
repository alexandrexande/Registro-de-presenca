plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'registrodepresenca'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
    bancoTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    bancoTestImplementation.extendsFrom testImplementation
    bancoTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('bancoTest', Test) {
    group = 'bancotestes'
    description = 'Testa as regras no Supabase e mantém os registros para consulta.'
    testClassesDirs = sourceSets.bancoTest.output.classesDirs
    classpath = sourceSets.bancoTest.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

tasks.register('prepararDadosTeste', JavaExec) {
    group = 'bancotestes'
    description = 'Cria exemplos identificados como TESTE no Supabase.'
    classpath = sourceSets.bancoTest.runtimeClasspath
    mainClass = 'registrodepresenca.demo.DadosTesteBanco'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    bancoTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
