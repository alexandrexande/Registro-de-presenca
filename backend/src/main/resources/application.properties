spring.application.name=demo
spring.datasource.url=jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

mqtt.broker=7a323450744041aaa8ea29e6eec6ace9.s1.eu.hivemq.cloud
mqtt.port=8883
mqtt.username=${MQTT_USER}
mqtt.password=${MQTT_PASSWORD}
mqtt.topic.entrada=escola/rfid/leituras
mqtt.topic.resposta=escola/rfid/resposta

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=8081
# Opcional: sem este arquivo o sistema sobe normalmente, só o relatório mensal fica indisponível
google.credentials.path=${GOOGLE_CREDENTIALS_PATH:}
google.sheets.spreadsheet-id=1Rrev5zHsFDo5Hy05VBCWvkdJ40RNBx6dAJtjBGzORCg

# Login do frontend
# Defina AUTH_SECRET com um texto longo e aleatorio. Sem ele, um segredo temporario e criado a cada inicializacao
auth.secret=${AUTH_SECRET:}
auth.validade-horas=8

# Presença por aula: o cartão só vale nos últimos N minutos de cada aula
presenca.janela-minutos=10
